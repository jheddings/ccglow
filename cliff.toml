# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{%- for group, commits in commits | group_by(attribute="group") %}
{%- if group == "<!-- 4 -->Dependencies" %}
## Dependencies
{% for commit in commits | reverse | unique(attribute="scope") | sort(attribute="scope") -%}
{%- set ver = commit.message | split(pat=" to ") | last -%}
- {{ commit.scope }} → {{ ver }}
{% endfor %}
{%- else %}
## {{ group | striptags | trim }}
{% for commit in commits | filter(attribute="scope") | sort(attribute="scope") -%}
- **({{ commit.scope }})** {{ commit.message | split(pat="\n") | first }}
{% endfor -%}
{% for commit in commits -%}
{% if not commit.scope -%}
- {{ commit.message | split(pat="\n") | first }}
{% endif -%}
{% endfor -%}
{%- endif %}
{%- endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"

commit_preprocessors = [
  # strip PR/issue references for cleaner output
  { pattern = ' ?\([#\d, ]+\)', replace = '' },
]

commit_parsers = [
  # skip version bumps, lockfile maintenance, and merge commits
  { message = "^bump version", skip = true },
  { message = "^chore\\(deps\\): lock file maintenance", skip = true },
  { message = "^[Mm]erge", skip = true },

  # skip docs (design specs, implementation plans)
  { message = "^docs", skip = true },

  # dependency updates — route every deps bump to the Dependencies group,
  # capturing the package name as scope. Renovate splits these between
  # fix(deps) and chore(deps) depending on whether the dependency is a runtime
  # one, so both types are matched together. Order matters: most specific
  # first, so the lazy trailing rule doesn't swallow the descriptor words.
  # Go repos say "module" where other ecosystems say "dependency", and the go
  # directive has no package name at all — without those two rules the
  # catch-all captures scopes like "module github.com/x" and "go module
  # directive".
  { message = "^(?:fix|chore)\\(deps\\): (?:update|bump) dependency (.+?) to", group = "<!-- 4 -->Dependencies", scope = "${1}" },
  { message = "^(?:fix|chore)\\(deps\\): (?:update|bump) go module directive to", group = "<!-- 4 -->Dependencies", scope = "go" },
  { message = "^(?:fix|chore)\\(deps\\): (?:update|bump) module (.+?) to", group = "<!-- 4 -->Dependencies", scope = "${1}" },
  { message = "^(?:fix|chore)\\(deps\\): (?:update|bump) (.+?) monorepo", group = "<!-- 4 -->Dependencies", scope = "${1}" },
  { message = "^(?:fix|chore)\\(deps\\): (?:update|bump) (.+?) (?:action|docker tag) to", group = "<!-- 4 -->Dependencies", scope = "${1}" },
  { message = "^(?:fix|chore)\\(deps\\): (?:update|bump) (.+?) to", group = "<!-- 4 -->Dependencies", scope = "${1}" },

  # standard type mapping
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^chore", group = "<!-- 3 -->Maintenance" },
  { message = "^refactor", group = "<!-- 3 -->Maintenance" },
  { message = "^test", group = "<!-- 3 -->Maintenance" },
  { message = "^style", group = "<!-- 3 -->Maintenance" },
  { message = "^perf", group = "<!-- 3 -->Maintenance" },

  # catch-all for unconventional commits
  { message = ".*", skip = true },
]
